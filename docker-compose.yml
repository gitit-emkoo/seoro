services:
  db:
    image: postgres:16-alpine
    container_name: seoro-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seoro
    volumes:
      - seoro_pg_data:/var/lib/postgresql/data

volumes:
  seoro_pg_data:
